<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=devive-width,initial-scale=1.0 viewport-fit=cover">
  <link href="https://unpkg.com/tailwindcss@^3.0.0/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/chats.css">
   <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="bootstrap-icons-1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style/flowbite.min.css">
  <title>STUDENT DASHBOARD</title>
</head>
<body class="body dark:bg-gray-800 ">
  <div class="chats">
   <div class="chat-header flex items-center gap-3 p-4 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700">
    <button class="p-1 text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition">
        <i class="bi bi-arrow-left text-2xl"></i>
    </button>
    <div class="relative mx-2">
        <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-5.jpg" alt="Avatar">
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
    </div>
    
    <div class="flex-1">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Prof. Martin Dupont</h3>
        <p class="text-xs text-green-600 dark:text-green-400">En ligne</p>
    </div>

    <button class="p-2 text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition" onclick="theme()">
        <i class="bi bi-moon-stars text-xl dark:block hidden"></i>
        <i class="bi bi-sun text-xl  dark:hidden"></i>
    </button>
</div>
<div class="chat-messages flex-1 overflow-y-auto p-4 bg-gray-200 dark:bg-gray-800 rounded-xl shadow-inner">
<div class="flex justify-start gap-2 my-2">
    <i class="bi bi-person-circle text-2xl text-gray-500 dark:text-gray-400"></i>
    <div class="max-w-[70%] p-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white">
        <p class="text-sm font-normal">Bonjour Emma, avez-vous bien reçu le sujet du devoir sur les dérivées ?</p>
        <div class="flex justify-end mt-1">
            <span class="text-xs text-gray-500 dark:text-gray-400">10:42</span>
        </div>
    </div>
</div>

<div class="flex justify-end gap-2 my-2">
    <div class="max-w-[70%] p-3 rounded-lg bg-blue-600 dark:bg-blue-700 text-white">
        <p class="text-sm font-normal">Oui, merci professeur. Je commence à travailler dessus. J’ai une question sur l’exercice 3.</p>
        <div class="flex justify-end mt-1">
            <span class="text-xs text-blue-100">10:44</span>
        </div>
    </div>
    <i class="bi bi-person-circle text-2xl text-gray-500 dark:text-gray-400"></i>
</div>
</div>

<div class="flex items-end gap-2 p-4 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 inp">
    <div class="flex-1 relative">
        <textarea id="autoResizeTextarea" rows="1" class="chat-input block w-full p-3 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500  overflow-hidden" placeholder="Écrivez votre message..."></textarea>
    </div>
    <button class="text-white bg-blue-600 hover:bg-blue-700 rounded-full transition flex items-center justify-center icb">
        <i class="bi bi-arrow-up text-xl"></i>
    </button>
</div>
</div>
  </div>
  
  
  
  <script src="style/flowbite.min.js"></script>
<script src="js/chats.js"></script>
</body>
