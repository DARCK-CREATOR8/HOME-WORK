<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat - HOME-WORK</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .chat-messages::-webkit-scrollbar-track { background: #1f2937; }
        .dark .chat-messages::-webkit-scrollbar-thumb { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">

    <!-- Conteneur principal : hauteur viewport dynamique -->
    <div class="relative h-dvh flex flex-col bg-white dark:bg-gray-800">
        
        <!-- En-tête (fixe) -->
        <div class="flex items-center gap-3 p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shrink-0">
            <button class="p-1 text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition">
                <i class="bi bi-arrow-left text-2xl"></i>
            </button>
            <div class="relative">
                <img class="w-10 h-10 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-5.jpg" alt="Avatar">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-800 rounded-full"></span>
            </div>
            <div>
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Prof. Martin Dupont</h3>
                <p class="text-xs text-green-600 dark:text-green-400">En ligne</p>
            </div>
        </div>

        <!-- Zone messages (scrollable) : sa hauteur sera contrôlée par JS -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex justify-start gap-2">
                <i class="bi bi-person-circle text-2xl text-gray-500 dark:text-gray-400"></i>
                <div class="max-w-[70%] p-3 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white">
                    <p class="text-sm font-normal">Bonjour Emma, avez-vous bien reçu le sujet du devoir sur les dérivées ?</p>
                    <div class="flex justify-end mt-1"><span class="text-xs text-gray-500 dark:text-gray-400">10:42</span></div>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <div class="max-w-[70%] p-3 rounded-xl bg-blue-600 dark:bg-blue-700 text-white">
                    <p class="text-sm font-normal">Oui, merci professeur. Je commence à travailler dessus. J’ai une question sur l’exercice 3.</p>
                    <div class="flex justify-end mt-1"><span class="text-xs text-blue-100">10:44</span></div>
                </div>
                <i class="bi bi-person-circle text-2xl text-gray-500 dark:text-gray-400"></i>
            </div>
            <!-- Ajoutez d'autres messages pour tester le scroll -->
        </div>

        <!-- Zone de saisie (auto-resize) -->
        <div class="shrink-0 p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
            <div class="flex items-end gap-2">
                <div class="flex-1 relative">
                    <textarea id="messageInput" rows="1" class="block w-full p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white resize-none overflow-hidden" placeholder="Écrivez votre message..."></textarea>
                </div>
                <button type="button" class="p-2.5 text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition flex items-center justify-center">
                    <i class="bi bi-send-fill text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const textarea = document.querySelector('.inp');
        const chatMessages = document.querySelector('chat-messages');
        let originalFlex = true;

        function adjustChatHeight() {
            // On utilise visualViewport pour connaître la hauteur réelle disponible après l'ouverture du clavier
            if (window.visualViewport) {
                const viewportHeight = window.visualViewport.height;
                const headerHeight = document.querySelector('.shrink-0')?.offsetHeight || 0;
                const inputHeight = document.querySelector('.shrink-0.p-4')?.offsetHeight || 0;
                const availableHeight = viewportHeight - headerHeight - inputHeight;
                if (availableHeight > 0) {
                    chatMessages.style.height = availableHeight + 'px';
                    chatMessages.style.flex = 'none';
                } else {
                    chatMessages.style.height = '';
                    chatMessages.style.flex = '';
                }
            }
        }

        // Quand le textarea reçoit le focus (clavier apparaît)
        textarea.addEventListener('focus', () => {
            // On laisse le temps au clavier de s'ouvrir
            setTimeout(adjustChatHeight, 100);
        });

        // Quand le textarea perd le focus (clavier disparaît)
        textarea.addEventListener('blur', () => {
            // Restaurer le comportement flex normal
            chatMessages.style.height = '';
            chatMessages.style.flex = '';
        });

        // Écouter les changements de taille du viewport (clavier qui change)
        window.visualViewport?.addEventListener('resize', () => {
            if (document.activeElement === textarea) {
                adjustChatHeight();
            }
        });

        // Auto-resize du textarea
        
        });
    </script>
</body>
</html>
